<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        /* --- Reset & Base Styles --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            padding: 40px 20px;
        }
        #about {
            max-width: 1000px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        /* --- Project Grid Layout --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .project-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .project-card h3 {
            margin-bottom: 15px;
            color: #00adb5;
        }

        /* --- 3D Model Display Containers --- */
        .model-container {
            width: 100%;
            height: 250px;
            background: #2d2d2d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .model-container::after {
            content: "🔍 Click to expand";
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .model-container:hover::after {
            opacity: 1;
        }
        /* Placeholder styling for your 3D canvas objects */
        .model-placeholder {
            width: 80px;
            height: 80px;
            background: #00adb5;
            border-radius: 50%;
            animation: spin 4s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(300deg); } }

        /* --- Video Container --- */
        .video-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
        }
        .video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- Modal Popup System --- */
        .modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
        }
        .modal.open {
            display: flex;
        }
        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            max-width: 80vw;
            max-height: 80vh;
            width: 600px;
            height: 500px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #00adb5;
        }
        #modal-target-view {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <section id="about">
        <h2>My Projects</h2>

        <div class="projects-grid">

            <!-- PROJECT 1: Clickable 3D Model -->
            <div class="project-card">
                <h3>Project One</h3>
                <div class="model-container" data-model="Model 1 Expanded Visuals">
                    <!-- Replace div below with your actual 3D canvas context -->
                    <div class="model-placeholder"></div>
                </div>
                <p>Interactive 3D workspace setup.</p>
            </div>

            <!-- PROJECT 2: Clickable 3D Model (Fixed to copy Project 1) -->
            <div class="project-card">
                <h3>Project Two</h3>
                <div class="model-container" data-model="Model 2 Expanded Visuals">
                    <!-- Replace div below with your actual 3D canvas context -->
                    <div class="model-placeholder" style="background: #ff5722;"></div>
                </div>
                <p>Interactive secondary 3D layout asset.</p>
            </div>

            <!-- PROJECT 3: Showcasing the Video Asset -->
            <div class="project-card">
                <h3>Project Three</h3>
                <div class="video-wrapper">
                    <video width="100%" height="auto" autoplay loop muted playsinline>
                        <source src="Sequence 01_1.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <p>Render output video demonstration sequence.</p>
            </div>

        </div>
    </section>

    <!-- Global Modal Structure for viewing bigger models -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div id="modal-target-view">
                <!-- Target injected via JS dynamically -->
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const containers = document.querySelectorAll('.model-container');
        const modal = document.getElementById('viewModal');
        const closeModal = document.getElementById('closeModal');
        const modalTarget = document.getElementById('modal-target-view');

        // Loop through all 3D components with the class name
        containers.forEach(container => {
            container.addEventListener('click', () => {
                const modelIdentifier = container.getAttribute('data-model');

                // Open the frame overlay
                modal.classList.add('open');

                // Scale up layout context inside modal frame
                modalTarget.innerHTML = `
                    <div style="text-align:center;">
                        <h2 style="color:#00adb5; margin-bottom:10px;">Viewing Bigger</h2>
                        <p style="font-size:1.2rem;">[ ${modelIdentifier} Enriched Render Target Window ]</p>
                    </div>
                `;
            });
        });

        // Close logic actions
        closeModal.addEventListener('click', () => {
            modal.classList.remove('open');
            modalTarget.innerHTML = '';
        });

        // Close if background mask is selected directly
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('open');
                modalTarget.innerHTML = '';
            }
        });
    </script>

</body>
</html>
