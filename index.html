<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sumin Kim | Portfolio</title>
  <meta name="description" content="Portfolio of Sumin Kim.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="kimsm.css">

  <style>
    /* Global Smooth Scrolling and Transition Setup */
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    /* Red Point Color Variable */
    :root {
      --point-color: #e63946;
      --text-dark: #111111;
    }

    .text-point {
      color: var(--point-color);
      font-weight: 600;
      transition: color 0.4s ease;
    }

    /* Footer Default Overrides */
    .footer {
      background-color: var(--point-color) !important;
      color: #ffffff !important;
      padding: 60px 0;
      transition: background-color 0.4s ease, color 0.4s ease;
    }
    .footer-text, .footer-email, .copyright {
      color: #ffffff !important;
    }
    .footer-email:hover {
      opacity: 0.8;
    }

    /* Active Background Inversions on Project Card Hover */
    body.project-hovered {
      background-color: var(--point-color) !important;
      color: #ffffff !important;
    }

    body.project-hovered .text-point {
      color: #ffffff !important;
    }

    body.project-hovered .navbar .logo,
    body.project-hovered .nav-links a,
    body.project-hovered .section-title,
    body.project-hovered .about-text,
    body.project-hovered .project-name,
    body.project-hovered .project-desc {
      color: #ffffff !important;
    }

    /* Invert the footer to White background when project grid is active */
    body.project-hovered .footer {
      background-color: #ffffff !important;
    }
    body.project-hovered .footer-text,
    body.project-hovered .footer-email,
    body.project-hovered .copyright {
      color: var(--text-dark) !important;
    }

    /* Dynamic Page Entry/Scroll Animations */
    .animate-on-load {
      animation: fadeInUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* About Section Styling */
    .about-section {
      padding: 80px 0;
      border-top: 1px solid #eee;
      transition: border-color 0.4s ease;
    }
    body.project-hovered .about-section {
      border-top-color: rgba(255, 255, 255, 0.2);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
    .about-text {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #444;
      transition: color 0.4s ease;
    }

    /* Interactive Hover Effects for Navbar & Buttons */
    .nav-links a {
      position: relative;
      transition: color 0.3s ease;
    }
    .nav-links a:hover {
      color: var(--point-color) !important;
    }
    body.project-hovered .nav-links a:hover {
      color: #111111 !important;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--point-color);
      transition: width 0.3s ease, background-color 0.4s ease;
    }
    body.project-hovered .nav-links a::after {
      background-color: #ffffff;
    }
    .nav-links a:hover::after {
      width: 100%;
    }

    .btn-outline {
      border: 2px solid var(--point-color) !important;
      color: var(--point-color) !important;
      transition: all 0.3s ease !important;
    }
    .btn-outline:hover {
      background-color: var(--point-color) !important;
      color: #fff !important;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(230, 57, 70, 0.2);
    }
    body.project-hovered .btn-outline {
      border-color: #ffffff !important;
      color: #ffffff !important;
    }
    body.project-hovered .btn-outline:hover {
      background-color: #ffffff !important;
      color: var(--point-color) !important;
    }

    /* Interactive Cards */
    .project-card {
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease !important;
      cursor: pointer;
    }
    .project-card:hover {
      transform: translateY(-8px);
    }

    /* Custom Project Tags */
    .project-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
